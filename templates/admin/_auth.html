<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{% endblock %} | {{ store.name }} admin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>try { var t = localStorage.getItem("theme"); if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark"); } catch (e) {}</script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="grid min-h-dvh place-items-center bg-zinc-100 px-4 py-10 text-zinc-900 antialiased dark:bg-[#0e0e10] dark:text-zinc-100">
  <main class="w-full max-w-sm">
    <div class="mb-6 flex items-center justify-center gap-3">
      <span class="grid size-11 place-items-center rounded-xl bg-zinc-900 p-1.5 text-white [&_svg]:size-full dark:bg-white dark:text-zinc-900">{% include "partials/logo_anim.svg" %}</span>
      <span class="font-display text-xl font-semibold">{{ store.name }}</span>
    </div>
    <div class="rounded-2xl border border-zinc-200 bg-white p-6 shadow-sm dark:border-zinc-800 dark:bg-[#18181b]">
      {% block card %}{% endblock %}
    </div>
    <p class="mt-5 text-center text-sm text-zinc-500"><a class="hover:underline" href="{{ url_for('home') }}">← Back to the website</a></p>
  </main>
</body>
</html>
