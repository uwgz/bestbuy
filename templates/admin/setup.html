{% extends "admin/_auth.html" %}
{% block title %}Create your account{% endblock %}
{% block card %}
<h1 class="text-xl">Create your account</h1>
<p class="mt-1 text-sm text-zinc-500 dark:text-zinc-400">First visit: this makes you the owner. Only you will be able to sign in.</p>
{% if error %}<p class="mt-4 rounded-lg bg-sale/10 px-3 py-2 text-sm text-sale" role="alert">{{ error }}</p>{% endif %}
<form method="post" class="mt-5 space-y-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label class="block text-sm font-medium">Your name<input name="name" required autocomplete="name" autofocus class="field mt-1.5 rounded-lg py-2" value="{{ request.form.get('name', '') }}"></label>
  <label class="block text-sm font-medium">Email<input name="email" type="email" required autocomplete="username" class="field mt-1.5 rounded-lg py-2" value="{{ request.form.get('email', '') }}"></label>
  <div class="grid grid-cols-2 gap-3">
    <label class="block text-sm font-medium">Password<input name="password" type="password" required minlength="8" autocomplete="new-password" class="field mt-1.5 rounded-lg py-2"></label>
    <label class="block text-sm font-medium">Again<input name="confirm" type="password" required minlength="8" autocomplete="new-password" class="field mt-1.5 rounded-lg py-2"></label>
  </div>
  <button class="h-11 w-full rounded-lg bg-brand text-[15px] font-semibold text-white hover:bg-brand-dark">Create account</button>
</form>
{% endblock %}
