{% extends "layouts/base.html" %}
{% block title %}Book a Session{% endblock %}
{% block content %}
<section class="page-head">
  <div class="container">
    <h1>Book a session</h1>
    <p class="muted">Tell us what you need and we'll confirm within 24 hours.</p>
  </div>
</section>
<section class="section">
  <div class="container form-wrap">
    <form method="post" class="card-form">{{ csrf_field() }}
      <div class="form-row">
        <label>Full name *<input name="name" value="{{ form.get('name', '') }}" required></label>
        <label>Email *<input type="email" name="email" value="{{ form.get('email', '') }}" required></label>
      </div>
      <div class="form-row">
        <label>Phone<input type="tel" name="phone" value="{{ form.get('phone', '') }}"></label>
        <label>Preferred date *<input type="date" name="date" value="{{ form.get('date', '') }}" required></label>
      </div>
      <label>Service *
        <select name="service" required>
          <option value="">Choose a service…</option>
          {% for s in services %}
            <option value="{{ s.slug }}" {{ 'selected' if form.get('service') == s.slug }}>{{ s.name }} — {{ s.price }}</option>
          {% endfor %}
        </select>
      </label>
      <label>Notes<textarea name="notes" rows="5" placeholder="Location, number of people, ideas…">{{ form.get('notes', '') }}</textarea></label>
      <button class="btn" type="submit">Send booking request</button>
    </form>
  </div>
</section>
{% endblock %}
