{# the main form; used on its own page and, empty, as the "+ Add" pop-up #}
<form method="post" action="{{ url_for('admin.service_edit') if not service else '' }}" enctype="multipart/form-data" class="adm-form adm-form-grid">{{ csrf_field() }}
  <section class="card">
    <h2>Details</h2>
    <label>Service name<input name="name" value="{{ form.get('name', '') }}" required maxlength="80"></label>
    <div class="form-row form-row-3">
      <label>Before the price<input name="price_prefix" value="{{ form.get('price_prefix', 'from') }}" maxlength="30" placeholder="from">
        <small>e.g. "from" or "Ask for a quote"</small></label>
      <label>Price ({{ business.currency }})<input name="price_amount" value="{{ form.get('price_amount', '') }}" inputmode="decimal"
        placeholder="{{ '149000' if business.currency_decimals == 0 else '149' }}"><small>Leave empty to show no amount</small></label>
      <label>After the price<input name="price_suffix" value="{{ form.get('price_suffix', '') }}" maxlength="30" placeholder="/ item"><small>e.g. "/ item", "per hour"</small></label>
    </div>
    <label>Headline<input name="tagline" value="{{ form.get('tagline', '') }}" maxlength="160" placeholder="Your day, beautifully remembered."></label>
    <label>Description<textarea name="description" rows="2" maxlength="2000">{{ form.get('description', '') }}</textarea></label>
    <label>What's included <small>(one per line)</small><textarea name="includes" rows="3" maxlength="1000" placeholder="One per line">{{ form.get('includes', '') }}</textarea></label>
    <div class="form-row">
      <label>Icon
        <select name="icon">{% for i in icons %}<option value="{{ i }}" {{ 'selected' if form.get('icon') == i }}>{{ i|capitalize }}</option>{% endfor %}</select>
      </label>
      <label>Order on page<input type="number" name="position" value="{{ form.get('position', 1) }}" min="0" max="999"></label>
    </div>
    <label class="check"><input type="checkbox" name="is_active" value="1" {{ 'checked' if form.get('is_active') }}> Visible on the site</label>
  </section>

  <section class="card" id="photos">
    <h2>Photos</h2>
    {% if service and service.images %}
      <div class="photo-grid">
        {% for img in service.images %}
          <figure class="photo-tile photo-cover{{ ' is-cover' if loop.first }}">
            <img src="{{ img.url }}" alt="">
            {% if loop.first %}<figcaption>Cover</figcaption>{% endif %}
            <div class="photo-actions">
              {% if not loop.first %}<button class="btn btn-small btn-light" type="submit" form="cover-{{ img.id }}">Make cover</button>{% endif %}
              <button class="btn btn-small btn-danger" type="submit" form="del-{{ img.id }}">Remove</button>
            </div>
          </figure>
        {% endfor %}
      </div>
    {% endif %}
    <label class="drop">{{ icon("upload") }}<span><b>Add photos</b><small>Your best shots for this service — portrait (tall) photos look best.</small></span>
      <input type="file" name="photos" accept="image/jpeg,image/png,image/webp,image/avif" multiple></label>
    <p class="drop-list"></p>
  </section>

  <div class="save-bar span-2">
    <button class="btn" type="submit">{{ 'Save changes' if service else 'Add service' }}</button>
    <a class="btn btn-outline" href="{{ url_for('admin.services_list') }}">Cancel</a>
  </div>
</form>
