{# "Record a sale" pop-up, opened by a button with data-modal="#sale-form" #}
<template id="sale-form">
  <form method="post" class="adm-form" action="{{ url_for('admin.sales_page') }}" data-currency="{{ business.currency }}" data-decimals="{{ business.currency_decimals }}">{{ csrf_field() }}
    {% if sale_products %}
    <label>Product
      <select name="product_id" required data-sale-product>
        <option value="">Choose a product</option>
        {% for p in sale_products %}
          <option value="{{ p.id }}" data-price="{{ '%.*f'|format(business.currency_decimals, p.price) }}">{{ p.short }} · {{ p.stock_qty }} in stock</option>
        {% endfor %}
      </select></label>
    <div class="form-row form-row-3">
      <label>Quantity<input type="number" name="qty" value="1" min="1" max="10000" inputmode="numeric" required data-sale-qty></label>
      <label>Price each ({{ business.currency }})<input name="unit_price" inputmode="decimal" required data-sale-unit placeholder="{{ '1299000' if business.currency_decimals == 0 else '1299.99' }}"></label>
      <label>Date<input type="date" name="sold_on" value="{{ today }}" max="{{ today }}" required></label>
    </div>
    <label>Note <small>(optional)</small><input name="note" maxlength="200" placeholder="Paid with MoMo, customer name…"></label>
    <p class="sale-total" data-sale-total aria-live="polite">Total <b>—</b></p>
    <div class="save-bar"><button class="btn" type="submit">Record sale</button><button class="btn btn-outline" type="button" data-modal-close>Cancel</button></div>
    {% else %}
    <p class="muted">Add a product first; then you can record its sales here.</p>
    <div class="save-bar"><a class="btn" href="{{ url_for('admin.product_new') }}">Add a product</a><button class="btn btn-outline" type="button" data-modal-close>Cancel</button></div>
    {% endif %}
  </form>
</template>
