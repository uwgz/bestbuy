{# Loading screen: the logo with its red recording light blinking.
   Hidden unless a page takes a moment (see js/loader.js). The drawing is generated by tools/brand.py. #}
<div class="page-loader" id="page-loader" role="status" aria-live="polite" hidden>
  <div class="pl-box">
    {% include "partials/loader_mark.svg" %}
    <span class="pl-text">Loading…</span>
  </div>
</div>
<script>
  /* first visit: show the loader only if the page is still loading after a moment */
  (function () {
    var el = document.getElementById("page-loader");
    window.__plTimer = setTimeout(function () { if (document.readyState !== "complete") { el.hidden = false; el.classList.add("show"); } }, 700);
  })();
</script>
